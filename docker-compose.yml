services:
  postgres:
    image: postgres:16-alpine
    container_name: aarambh-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aarambhai
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - aarambh-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aarambh-redis
    ports:
      - "6379:6379"
    volumes:
      - aarambh-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  aarambh-pg-data:
  aarambh-redis-data: